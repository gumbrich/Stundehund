name: stundehund
description: Private desktop timekeeping with a floating project bar and CSV export.
publish_to: none
version: 0.2.0+3
environment:
  sdk: ^3.11.3
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  path_provider: ^2.1.5
  file_selector: ^1.1.0
  window_manager: 0.5.2
  screen_retriever: 0.2.2
dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/stundehund.png
    - assets/animals/
