name: Windows build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build windows --release
      - name: Include Visual C++ runtime
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -property installationPath
          $crt = Get-ChildItem "$vs\VC\Redist\MSVC\*\x64\Microsoft.VC143.CRT" -Directory | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $crt) { throw 'Visual C++ runtime was not found.' }
          Copy-Item "$($crt.FullName)\*.dll" build\windows\x64\runner\Release\
          Copy-Item docs\WINDOWS-START.txt build\windows\x64\runner\Release\LIESMICH.txt
      - name: Package portable application
        shell: pwsh
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath Stundehund-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Stundehund-Windows-x64
          path: Stundehund-Windows-x64.zip
          if-no-files-found: error
          retention-days: 90
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Stundehund-Windows-x64
      - name: Publish private repository release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" Stundehund-Windows-x64.zip --repo "$GITHUB_REPOSITORY" --title "Stundehund $GITHUB_REF_NAME" --generate-notes
