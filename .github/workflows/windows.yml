name: Windows build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          channel: stable
          cache: true
      - name: Check, build and package Windows application
        shell: pwsh
        run: ./tool/build_windows.ps1
      # Development artifacts are optional; release packages are uploaded
      # directly below so Actions artifact quota cannot block a release.
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        continue-on-error: true
        with:
          name: Stundehund-Windows-x64
          path: Stundehund-Windows-x64.zip
          if-no-files-found: error
          retention-days: 90
      - name: Upload Windows package to a draft private release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" Stundehund-Windows-x64.zip --repo "$env:GITHUB_REPOSITORY" --verify-tag --title "Stundehund $env:GITHUB_REF_NAME" --generate-notes --draft --prerelease
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed.' }
