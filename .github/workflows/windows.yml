name: Windows build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          channel: stable
          cache: true
      - name: Check, build and package Windows application
        shell: pwsh
        run: ./tool/build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Stundehund-Windows-x64
          path: Stundehund-Windows-x64.zip
          if-no-files-found: error
          retention-days: 90
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Stundehund-Windows-x64
      - name: Publish private repository release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" Stundehund-Windows-x64.zip --repo "$GITHUB_REPOSITORY" --title "Stundehund $GITHUB_REF_NAME" --generate-notes
